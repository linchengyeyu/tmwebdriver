name: Feature request
description: Suggest a new capability or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like TMWebDriver to do?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Links, examples, or related tools are helpful.
