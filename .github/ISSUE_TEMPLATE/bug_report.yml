name: Bug report
description: Report something that is broken or confusing.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Load the extension from assets/
        2. Run ...
        3. See ...
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version
      placeholder: "Chrome 149.0.x"
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "Python 3.12"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text
